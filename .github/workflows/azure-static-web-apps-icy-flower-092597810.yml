name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

jobs:
  # Deploy only happens on push to main (production). Pull requests no longer
  # create Azure Static Web Apps staging environments, which was exhausting the
  # per-app staging-environment quota. PRs are validated by build_pr_job below.
  build_and_deploy_job:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      # Vite inlines VITE_* vars at build time, so they must exist on disk when
      # Oryx runs the build inside the Static Web Apps container. Writing an
      # `.env.production` file (which Vite loads automatically for production
      # builds) is the most reliable way to pass build-time config, because it
      # does not depend on env-var propagation into the Oryx container.
      # Configure these secrets in the repository settings.
      - name: Write production environment file
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}"
          } > sigloc-ui/.env.production
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_FLOWER_092597810 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "./sigloc-ui" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  # Pull requests are validated with a plain Vite build (no Azure deploy), so
  # they never allocate a staging environment.
  build_pr_job:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build PR Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write production environment file
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}"
          } > sigloc-ui/.env.production
      - name: Install dependencies
        working-directory: ./sigloc-ui
        run: npm ci
      - name: Build
        working-directory: ./sigloc-ui
        run: npm run build
